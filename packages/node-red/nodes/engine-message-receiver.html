<script type="text/javascript">
  RED.nodes.registerType('engine-message-receiver', {
    category: 'sxs industrial',
    color: '#8fb8a8',
    defaults: {
      name: { value: '' },
      engine: { value: '', type: 'insight-engine', required: true },
      eventPatterns: { value: '*' },
      batchMode: { value: false },
      batchWindowMs: {
        value: 1000,
        validate: function (value) {
          return RED.validators.number()(value) && Number(value) >= 1000 && Number(value) <= 10000;
        },
      },
      batchMaxEvents: {
        value: 100,
        validate: function (value) {
          return RED.validators.number()(value) && Number(value) >= 2 && Number(value) <= 100;
        },
      },
    },
    oneditprepare: function () {
      const updateBatchInputs = function () {
        const enabled = $('#node-input-batchMode').prop('checked');
        $('#node-input-batchWindowMs').prop('disabled', !enabled);
        $('#node-input-batchMaxEvents').prop('disabled', !enabled);
      };
      $('#node-input-batchMode').on('change', updateBatchInputs);
      updateBatchInputs();
    },
    inputs: 0,
    outputs: 1,
    label: function () {
      return this.name || 'Engine Message Receiver';
    },
  });
</script>

<script type="text/html" data-template-name="engine-message-receiver">
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" />
  </div>
  <div class="form-row">
    <label for="node-input-engine">Engine</label>
    <input type="text" id="node-input-engine" />
  </div>
  <div class="form-row">
    <label for="node-input-eventPatterns">Event patterns</label>
    <input type="text" id="node-input-eventPatterns" placeholder="entity.updated, diagnostic.*" />
  </div>
  <div class="form-row">
    <label for="node-input-batchMode"><i class="fa fa-list"></i> Batch messages</label>
    <input
      type="checkbox"
      id="node-input-batchMode"
      style="display: inline-block; width: auto; vertical-align: top;"
    />
  </div>
  <div class="form-row">
    <label for="node-input-batchWindowMs">Batch window (ms)</label>
    <input type="number" id="node-input-batchWindowMs" min="1000" max="10000" />
  </div>
  <div class="form-row">
    <label for="node-input-batchMaxEvents">Batch maximum events</label>
    <input type="number" id="node-input-batchMaxEvents" min="2" max="100" />
  </div>
</script>

<script type="text/x-red" data-help-name="engine-message-receiver">
  <p>Receives events from an Insight Engine and sends them as Node-RED messages.</p>
  <p>
    Each output message has <code>msg.topic</code> and <code>msg.event</code>. The event
    contains its type, timestamp, source, and event data where needed. It never contains live
    Engine objects or full state. Use an Engine State Snapshot node when state is needed.
  </p>
  <p><strong>Event patterns</strong></p>
  <p>Enter one or more event types, separated by commas or lines.</p>
  <ul>
    <li><code>*</code> receives every event.</li>
    <li><code>entity.updated</code> receives entity state-change notifications.</li>
    <li><code>application.executed</code> receives every completed Application run.</li>
    <li><code>diagnostic.*</code> receives raised, updated, and cleared diagnostics.</li>
    <li><code>engine.lifecycle, engine.ready</code> receives Engine readiness changes.</li>
  </ul>
  <p>
    With <b>Batch messages</b> clear, every matching event is sent immediately in Engine
    publication order. When selected, the first matching event starts a fixed batch window. At
    the end of that window the node emits one <code>engine.event-batch</code> message. Its
    <code>msg.event.data.events</code> array contains every matching event in arrival order.
    The batch holds between 2 and 100 events; when full, the oldest events are discarded and
    <code>msg.event.data.droppedEventCount</code> reports the number omitted.
  </p>
  <p>
    <code>application.executed</code> data contains <code>success</code>,
    <code>resultChanged</code>, <code>lastRunTimestamp</code>, and
    <code>lastUpdateTimestamp</code>. A material Application result first emits
    <code>entity.updated</code>, then <code>application.executed</code>.
  </p>
  <p>
    The node sends the current <code>engine.lifecycle</code> event when it connects, so a flow
    can learn the current readiness state without waiting for the next transition.
  </p>
</script>
