<script type="text/javascript">
  RED.nodes.registerType('engine-state-snapshot', {
    category: 'sxs industrial',
    color: '#8fb8a8',
    defaults: {
      name: { value: '' },
      engine: { value: '', type: 'industrial-engine', required: true },
      snapshotRequest: {
        value: '{\n  "target": { "scope": "all" }\n}',
        required: true,
      },
    },
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || 'Engine State Snapshot';
    },
  });
</script>

<script type="text/html" data-template-name="engine-state-snapshot">
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" />
  </div>
  <div class="form-row">
    <label for="node-input-engine">Engine</label>
    <input type="text" id="node-input-engine" />
  </div>
  <div class="form-row">
    <label for="node-input-snapshotRequest">Request</label>
    <textarea id="node-input-snapshotRequest" rows="10" style="width: 70%"></textarea>
  </div>
</script>
