<script type="text/x-red" data-help-name="engine-state-snapshot">
    <p>Reads a serializable snapshot from an Insight Engine.</p>
    <p>
      An upstream Function or Change node must add a selector object as
      <code>msg.snapshotRequest</code>. This node preserves the input message, adds the result as
      <code>msg.snapshot</code>, and sends it from its output.
    </p>
    <p><strong>Request</strong></p>
    <p>Read all Devices and one Application diagnostic set from an incoming event:</p>
    <pre>msg.snapshotRequest = {
    entities: [{ type: 'device', ids: '*' }],
    diagnostics: [{
      type: msg.event.source.entityType,
      ids: msg.event.source.entityId
    }]
  };
  return msg;</pre>
    <p>Read an entity, its parent, children, and Application datafeeds:</p>
    <pre>msg.snapshotRequest = {
    entities: [{
      type: msg.event.source.entityType,
      ids: msg.event.source.entityId,
      parent: true,
      children: true,
      datafeeds: true,
      statePaths: ['currState', 'hasError']
    }]
  };
  return msg;</pre>
    <p><strong>Rules</strong></p>
    <ul>
      <li>A request must contain a nonempty <code>entities</code> or <code>diagnostics</code> array.</li>
      <li>Every selector requires a concrete <code>type</code> and <code>ids</code>. Entity types are <code>device</code>, <code>datastream</code>, <code>asset</code>, and <code>application</code>; diagnostic selectors also accept <code>common</code>.</li>
      <li><code>ids</code> is one runtime ID, a nonempty runtime-ID array, or <code>"*"</code>. The wildcard applies only to <code>ids</code>, never to <code>type</code>.</li>
      <li>Entity selectors may set <code>parent</code>, <code>children</code>, <code>datafeeds</code>, and <code>statePaths</code>. Omitted relationship targets and state paths are simply absent from the result.</li>
      <li>Selections are unioned and deduplicated. A complete-state selection takes precedence over a projected selection for the same entity.</li>
      <li>Diagnostic selectors do not accept entity relationship or state-path options. Unknown selected entities, malformed selectors, or a missing request call the Node-RED error handler and send no message.</li>
    </ul>
    <p>
      <code>msg.snapshot.entities</code> is keyed by entity type and runtime ID, for example
      <code>entities.datastream["Device%201/temp1"]</code>. <code>msg.snapshot.diagnostics</code>
      is keyed by lowercase category and source ID. Every response includes all entity and diagnostic
      group keys, even when a group is empty. Each entity state includes <code>hasError</code>;
      Device and Asset states also include <code>childrenError</code>. An entity with configured
      metadata also includes its immutable <code>extra</code> JSON value outside of
      <code>state</code>.
    </p>
</script>
